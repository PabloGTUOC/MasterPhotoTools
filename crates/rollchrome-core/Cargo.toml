[package]
name = "rollchrome-core"
version = "0.1.0"
edition = "2021"

[dependencies]
phototools-core = { path = "../core" }
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12.0"
sha2 = "0.11.0"
fast_image_resize = "6.1.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
# ED-23: automatic subject and sky masks run through ONNX Runtime, the owner's choice
# after ED-22 measured it (edit plan, Round 3). Not in §2.6 — recorded in the edit phase
# report (G8). Optional, behind `segment`, so `core` builds and tests without it (G2) and
# the NAS server never links it. Pinned: 2.0 is a release candidate.
ort = { version = "=2.0.0-rc.13", optional = true }

[features]
segment = ["dep:ort"]

[dev-dependencies]
tempfile = "3.10"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25.10"
sha2 = "0.11.0"
tiff = "0.11.3"

# The measuring tool for automatic masks (ED-23, MV-22); it runs the models, so it needs them.
[[example]]
name = "auto_mask"
required-features = ["segment"]
