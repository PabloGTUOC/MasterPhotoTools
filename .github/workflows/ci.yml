name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # exiftool is required for metadata *writing* (specification §2.6) and by
      # the test fixture generator. The webkit/gtk libraries are required to
      # build phototools-desktop (Tauri v2) on Linux; without them
      # `cargo build --workspace` cannot succeed.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Verify exiftool version
        run: |
          exiftool -ver
          # Build plan §3 requires exiftool >= 12
          test "$(exiftool -ver | cut -d. -f1)" -ge 12

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Isolated core tests
        run: cargo test -p phototools-core
