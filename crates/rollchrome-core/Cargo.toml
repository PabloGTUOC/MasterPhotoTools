[package]
name = "rollchrome-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
phototools-core = { path = "../core" }
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12.0"
sha2 = "0.11.0"
fast_image_resize = "6.1.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
dirs = "6.0.0"
rawler = "0.7.2"
moxcms = "0.8.1"
tiff = "0.11.3"
# ED-23: automatic subject and sky masks run through ONNX Runtime, the owner's choice
# after ED-22 measured it (edit plan, Round 3). Not in §2.6 — recorded in the edit phase
# report (G8). Optional, behind `segment`, so `core` builds and tests without it (G2) and
# the NAS server never links it. Pinned: 2.0 is a release candidate.
ort = { version = "=2.0.0-rc.13", optional = true }

# DV-4: spektrafilm-rs film simulation engine (GPL-3.0)
spektrafilm-core = { git = "https://github.com/turbasvin/spektrafilm-rs", rev = "9dd59b0380194b93686aaa230a8bb9680aa270a4", optional = true, features = ["precision-f64"] }
spektrafilm-gpu  = { git = "https://github.com/turbasvin/spektrafilm-rs", rev = "9dd59b0380194b93686aaa230a8bb9680aa270a4", optional = true, features = ["precision-f64"] }
spektrafilm-math = { git = "https://github.com/turbasvin/spektrafilm-rs", rev = "9dd59b0380194b93686aaa230a8bb9680aa270a4", optional = true, features = ["precision-f64"] }

[target.'cfg(target_os = "linux")'.dependencies]
openblas-src = { version = "0.10", optional = true, features = ["system"] }

[features]
segment = ["dep:ort"]
film = [
    "dep:spektrafilm-core",
    "dep:spektrafilm-gpu",
    "dep:spektrafilm-math",
    "dep:openblas-src",
]

[dev-dependencies]
tempfile = "3.10"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25.10"
sha2 = "0.11.0"
nom-exif = "3.6.2"

# The measuring tool for automatic masks (ED-23, MV-22); it runs the models, so it needs them.
[[example]]
name = "auto_mask"
required-features = ["segment"]

[[test]]
name = "film_tests"
required-features = ["film"]
