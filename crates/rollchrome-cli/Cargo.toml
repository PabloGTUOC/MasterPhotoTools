[package]
name = "rollchrome-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rollchrome-cli"
path = "src/main.rs"

[dependencies]
phototools-core = { path = "../core" }
rollchrome-core = { path = "../rollchrome-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
