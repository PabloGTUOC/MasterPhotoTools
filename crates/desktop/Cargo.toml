[package]
name = "phototools-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "phototools_desktop"
path = "src/lib.rs"

[[bin]]
name = "phototools-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
phototools-core = { path = "../core" }
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Specification §8: the desktop's HTTP calls to the server are made from the
# Rust side, never from the webview, which avoids CORS and mixed content.
# `blocking` because the handoff runs inside a job on its own std::thread
# (F17), where a synchronous client is the honest shape; the async client stays
# for the health probe, which is called from Tauri's async command context.
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
    "blocking",
], default-features = false }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
# F13's manual date actions parse dates at the command boundary.
chrono = "0.4"
keyring = "3"
# F10 watches /Volumes for newly mounted cards. Named in specification §2.6.
notify = "7"
# F10 raises a native notification when a card is detected.
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2.5.1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.10"
