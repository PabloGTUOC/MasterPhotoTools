# PhotoTools server on the NAS.
#
#     docker compose -f deploy/docker-compose.yml up -d
#
# Every value below comes from the environment or a .env file beside this one.
# Nothing here carries a secret: specification §9.2 rule 4 keeps credentials out
# of the repository, so this file names them and supplies none.

services:
  server:
    image: phototools-server:${PHOTOTOOLS_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: phototools-server
    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      # The photo library. Read-write because the archive tools (F1-F9) rewrite
      # metadata and move files in place. This is the path that must also appear
      # in ROOTS, and G6 refuses anything outside it.
      - ${LIBRARY_PATH:?set LIBRARY_PATH to the photo library on the NAS}:/library

      # The ledger and the staging directory. Deliberately a different volume
      # from the library: specification §7 requires the database to sit outside
      # the photographs, so that losing one cannot corrupt the other.
      - ${DATA_PATH:?set DATA_PATH to a directory for the ledger and staging}:/data

    environment:
      # G6 — the only directories any request may reach. /library is the
      # container's view of LIBRARY_PATH above; a path outside it is refused
      # however it is spelled. An empty ROOTS refuses everything.
      ROOTS: /library

      DATABASE_PATH: /data/phototools.db
      STAGING_DIR: /data/staging

      # F12's thresholds. Left as the specification's defaults; override here
      # rather than in the image so a change does not need a rebuild.
      MAX_MEGAPIXELS: ${MAX_MEGAPIXELS:-10}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-10485760}
      MAX_AGE_DAYS: ${MAX_AGE_DAYS:-90}

      # §5.3. ALLOWED_UIDS is the only thing restricting access to the library,
      # so it is required rather than defaulted: Firebase will authenticate any
      # Google account in existence, and an empty allow-list that defaulted to
      # "permit" would hand the library to all of them.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
      ALLOWED_UIDS: ${ALLOWED_UIDS:?set ALLOWED_UIDS to the Firebase uids permitted to use this server}

      # Break-glass token for the desktop handoff until Firebase sign-in is
      # wired into the desktop (docs/known-gaps.md). Optional, and unset means
      # unavailable rather than blank-permits.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}

      # F15. The redirect URI must match the OAuth client character for
      # character, including scheme and port, or the failure happens at Google's
      # end where this server never sees it (MV-12.3).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Publishing refuses to store a refresh token without this rather than
      # storing it in the clear. 32 bytes, hex: openssl rand -hex 32
      GOOGLE_REFRESH_TOKEN_ENCRYPTION_KEY: ${GOOGLE_REFRESH_TOKEN_ENCRYPTION_KEY:-}

      RUST_LOG: ${RUST_LOG:-phototools_server=info,tower_http=info}

    healthcheck:
      # /api/health is the one unauthenticated route (§5.3).
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # The process needs no privilege it cannot be given explicitly, and the
    # image already drops to uid 10001.
    security_opt:
      - no-new-privileges:true
