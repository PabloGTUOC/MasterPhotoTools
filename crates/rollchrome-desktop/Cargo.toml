[package]
name = "rollchrome-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "rollchrome_desktop"
path = "src/lib.rs"

[[bin]]
name = "rollchrome-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
phototools-core = { path = "../core" }
rollchrome-core = { path = "../rollchrome-core", features = ["segment"] }
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
image = "0.25"
