[package]
name = "phototools-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25.10"
fast_image_resize = "6.1.0"
nom-exif = "3.6.2"
zune-jpeg = "0.5.15"
walkdir = "2.5.0"
sha2 = "0.11.0"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
regex = "1.13.1"
tiff = "0.11.3"
dirs = "6.0.0"
mozjpeg = "0.10.13"
# F14 rung 3: the pure-Rust RAW fallback, and the only option on Linux.
# Named in specification §2.6.
rawler = "0.7.2"
# Specification §6.2 step 4: the Google refresh token is encrypted at rest with
# a key from the environment. Not named in §2.6, which lists no cipher at all —
# recorded in the Phase 12 report (G8). ChaCha20-Poly1305 rather than AES-GCM
# because the NAS may be ARM, where AES has no hardware backing and a
# constant-time software AES is the slower, more delicate option.
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3.10"
