name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # exiftool is required for metadata *writing* (specification §2.6) and by
      # the test fixture generator. The webkit/gtk libraries are required to
      # build phototools-desktop (Tauri v2) on Linux; without them
      # `cargo build --workspace` cannot succeed. nasm builds mozjpeg's SIMD
      # kernels — without it the JPEG encoder still works but loses the
      # assembly paths the §9.1 performance target depends on.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl \
            nasm \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Verify exiftool version
        run: |
          exiftool -ver
          # Build plan §3 requires exiftool >= 12
          test "$(exiftool -ver | cut -d. -f1)" -ge 12

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Isolated core tests
        run: cargo test -p phototools-core

  frontend:
    name: Front end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      # The web build consumes the shared client's compiled output, so the
      # shared package is built first.
      - name: Build the shared API client
        run: |
          npm --prefix frontend/shared ci
          npm --prefix frontend/shared run build

      - name: Install web dependencies
        run: npm --prefix frontend/web ci

      - name: Typecheck
        run: npm --prefix frontend/web run typecheck

      - name: Build
        run: npm --prefix frontend/web run build

      # Phase 6 acceptance: no view may reach the network directly.
      - name: Transport boundary
        run: npm --prefix frontend/web run check:transport

      # Phase 6 acceptance: layout at 390 px. Needs a browser, so it installs
      # one here rather than assuming the runner has it.
      - name: Install Chromium
        run: npx --prefix frontend/web playwright install --with-deps chromium

      - name: Layout at 390px
        run: npm --prefix frontend/web run check:layout

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-390px
          path: frontend/web/layout-proof/
          if-no-files-found: ignore
